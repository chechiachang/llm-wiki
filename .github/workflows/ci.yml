name: CI — Wiki Structure Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  structure-tests:
    name: Validate Wiki Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pytest

      - name: Run structure tests
        run: pytest tests/test_structure.py -v --tb=short

      - name: Check for broken internal links (summary)
        if: failure()
        run: |
          echo "::error::Wiki structure tests failed. Check internal links and page format."
